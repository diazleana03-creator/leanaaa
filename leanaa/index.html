<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f8ff;
            text-align: center;
        }
        header {
            background-color: #4a90e2;
            color: white;
            padding: 20px;
        }
        nav {
            background-color: #333;
            padding: 15px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }
        section {
            padding: 40px 20px;
        }
        button {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            border-radius: 5px;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Website!</h1>
        <p>A simple website made with HTML and CSS.</p>
    </header>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>
    <section id="home">
        <h2>Home</h2>
        <p>Welcome! Thank you for visiting my website.</p>
        <button onclick="alert('Hello! Welcome to my website!')">
            Click Me
        </button>
    </section>
    <section id="about">
        <h2>About Me</h2>
        <p>Hello! I am a student learning how to create websites.</p>
    </section>
    <section id="contact">
        <h2>Contact</h2>
        <p>Email: myemail@example.com</p>
    </section>
    <footer>
        <p>&copy; 2026 My Simple Website</p>
    </footer>
</body>
</html>
